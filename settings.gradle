pluginManagement {
	repositories {
		maven {
			name = 'nexus'
			url = nexusPublicUrl
			allowInsecureProtocol = true
			credentials {
				username = nexusUsername
				password = nexusPassword
			}
		}
		mavenLocal()
		mavenCentral()
		gradlePluginPortal()
		if (version.endsWith('-SNAPSHOT')) {
			maven {
				name = 'nexus'
				url = nexusSnapshotUrl
				allowInsecureProtocol = true
				credentials {
					username = nexusUsername
					password = nexusPassword
				}
			}
		}
//		if (version.endsWith('-SNAPSHOT')) {
//			maven { url "https://repo.spring.io/snapshot" }
//		}
	}
	resolutionStrategy {
		eachPlugin {
			if (requested.id.id == "org.jetbrains.kotlin.jvm") {
				useVersion "${kotlinVersion}"
			}
			if (requested.id.id == "org.jetbrains.kotlin.plugin.spring") {
				useVersion "${kotlinVersion}"
			}
		}
	}
}

plugins {
	id "com.gradle.enterprise" version "3.12.5"
	id "io.spring.ge.conventions" version "0.0.13"
}

// 根项目名称：引用 gradle.properties 中的 forkArtifactPrefix 动态拼接
// 修改方法：仅需修改 gradle.properties 中的 forkArtifactPrefix 即可全局生效
rootProject.name="${forkArtifactPrefix}-boot-build"

// 子项目名称转换：将上游原始名称 "spring-boot" 替换为 fork 制品名前缀
// "spring-boot" 作为替换源保持固定，因为这是 include 语句中使用的上游目录名称
rootProject.children.each { project ->
	project.name = project.name.replace("spring-boot", "${forkArtifactPrefix}-boot")
	project.children.each { subproject ->
		subproject.name = subproject.name.replace("spring-boot", "${forkArtifactPrefix}-boot")
	}
}

settings.gradle.projectsLoaded {
	gradleEnterprise {
		buildScan {
			def toolchainVersion = settings.gradle.rootProject.findProperty('toolchainVersion')
			if (toolchainVersion != null) {
				value('Toolchain version', toolchainVersion)
				tag("JDK-$toolchainVersion")
			}
			def buildDir = settings.gradle.rootProject.getBuildDir()
			buildDir.mkdirs()
			new File(buildDir, "build-scan-uri.txt").text = "build scan not generated"
			buildScanPublished { scan ->
				buildDir.mkdirs()
				new File(buildDir, "build-scan-uri.txt").text = "<${scan.buildScanUri}|build scan>\n"
			}
		}
	}
}

