	library("Jackson Bom", "${jacksonVersion}") {
		group("com.fasterxml.jackson") {
			imports = [
				"jackson-bom"
			]
		}
		// Jackson 2.21.x 的 jackson-module-jaxb-annotations 模块传递依赖了
		// javax.xml.bind:jaxb-api（其又传递依赖 javax.activation:javax.activation-api），
		// 这些 javax.* 依赖在项目禁止依赖检查中被拦截。排除 jaxb-api 即可同时
		// 阻断其传递依赖 javax.activation-api，无需单独排除后者。
		group("com.fasterxml.jackson.module") {
			modules = [
				"jackson-module-jaxb-annotations" {
					exclude group: "javax.xml.bind", module: "jaxb-api"
