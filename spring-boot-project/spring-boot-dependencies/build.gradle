// jackson-module-kotlin 2.17+ 使用 Kotlin 1.7+ 编译，与项目 Kotlin 1.6.21 不兼容。
// 使用 strictly 约束将其固定到 2.16.2（最后一个使用 Kotlin 1.6.21 编译的版本），
// 覆盖 jackson-bom 的版本管理，其余 Jackson 模块跟随 gradle.properties 中的 jacksonVersion 不变。
dependencies {
	constraints {
		api("com.fasterxml.jackson.module:jackson-module-kotlin") {
			version {
				strictly "2.16.2"
			}
			because "jackson-module-kotlin 2.17+ 使用 Kotlin 1.7+ 编译，与项目 Kotlin 1.6.21 二进制不兼容"
		}
	}
}

generateMetadataFileForMavenPublication {
	enabled = false
}
