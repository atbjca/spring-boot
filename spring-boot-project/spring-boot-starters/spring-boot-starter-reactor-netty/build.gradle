plugins {
	id "org.springframework.boot.starter"
}

description = "Starter for using Reactor Netty as the embedded reactive HTTP server."

dependencies {
	// 直接发布 NES GAV，避免 Maven 消费者绕过仅在本仓库构建期生效的 resolutionStrategy。
	api("cn.bjca.footstone.beactor.netty:bjca-footstone-beactor-netty-http:${reactorNettyNesVersion}")
}
