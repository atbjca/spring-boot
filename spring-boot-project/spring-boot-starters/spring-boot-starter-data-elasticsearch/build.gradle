plugins {
	id "org.springframework.boot.starter"
}

description = "Starter for using Elasticsearch search and analytics engine and Spring Data Elasticsearch"

dependencies {
	api(project(":spring-boot-project:spring-boot-starters:spring-boot-starter"))
	// 直接发布 NES GAV，避免 Maven 消费者绕过仅在本仓库构建期生效的 resolutionStrategy。
	api("cn.bjca.footstone.bpring.data:bjca-footstone-bpring-data-elasticsearch:${springDataElasticsearchNesVersion}")
	api("at.yawk.lz4:lz4-java")
}
