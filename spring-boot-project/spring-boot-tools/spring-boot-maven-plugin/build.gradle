plugins {
	id "org.asciidoctor.jvm.convert"
	id "org.springframework.boot.conventions"
	id "org.springframework.boot.maven-plugin"
	id "org.springframework.boot.optional-dependencies"
}

description = "Spring Boot Maven Plugin"

configurations {
	dependenciesBom
	documentation
}

dependencies {
	asciidoctorExtensions("io.spring.asciidoctor:spring-asciidoctor-extensions-section-ids")

	compileOnly("org.apache.maven.plugin-tools:maven-plugin-annotations")
	compileOnly("org.sonatype.plexus:plexus-build-api")
	compileOnly("org.apache.maven.shared:maven-common-artifact-filters") {
		exclude(group: "javax.annotation", module: "javax.annotation-api")
		exclude(group: "javax.enterprise", module: "cdi-api")
		exclude(group: "javax.inject", module: "javax.inject")
	}
	compileOnly("org.apache.maven:maven-plugin-api") {
		exclude(group: "javax.annotation", module: "javax.annotation-api")
		exclude(group: "javax.enterprise", module: "cdi-api")
		exclude(group: "javax.inject", module: "javax.inject")
	}

	implementation(project(":spring-boot-project:spring-boot-tools:spring-boot-buildpack-platform"))
	implementation(project(":spring-boot-project:spring-boot-tools:spring-boot-loader-tools"))

	intTestImplementation(project(":spring-boot-project:spring-boot-tools:spring-boot-buildpack-platform"))
	intTestImplementation(project(":spring-boot-project:spring-boot-tools:spring-boot-loader-tools"))
	intTestImplementation(project(":spring-boot-project:spring-boot-tools:spring-boot-test-support"))
	intTestImplementation("org.apache.maven.shared:maven-invoker") {
		exclude(group: "javax.inject", module: "javax.inject")
	}
	intTestImplementation("org.assertj:assertj-core")
	intTestImplementation("org.junit.jupiter:junit-jupiter")
	intTestImplementation("org.testcontainers:testcontainers")
	intTestImplementation("org.testcontainers:junit-jupiter")

	mavenOptionalImplementation("org.apache.maven.plugins:maven-shade-plugin") {
		exclude(group: "javax.annotation", module: "javax.annotation-api")
		exclude(group: "javax.enterprise", module: "cdi-api")
		exclude(group: "javax.inject", module: "javax.inject")
	}

	runtimeOnly("org.sonatype.plexus:plexus-build-api")

	testImplementation("org.assertj:assertj-core")
	testImplementation("org.junit.jupiter:junit-jupiter")
	testImplementation("org.mockito:mockito-core")
	testImplementation("org.mockito:mockito-junit-jupiter")
	testImplementation("org.springframework:spring-core")

	versionProperties(project(path: ":spring-boot-project:spring-boot-dependencies", configuration: "effectiveBom"))
}

ext {
	versionElements = version.split("\\.")
	xsdVersion = versionElements[0] + "." + versionElements[1]
}

syncDocumentationSourceForAsciidoctor {
	from(documentPluginGoals) {
		into "asciidoc/goals"
	}
}

sourceSets {
	main {
		output.dir("${buildDir}/generated/resources/xsd", builtBy: "xsdResources")
	}
	intTest {
		output.dir("${buildDir}/generated-resources", builtBy: "extractVersionProperties")
	}
}

tasks.withType(org.asciidoctor.gradle.jvm.AbstractAsciidoctorTask) {
	doFirst {
		attributes "spring-boot-xsd-version" : project.ext.xsdVersion
	}
}

asciidoctor {
	sources {
		include "index.adoc"
	}
}

task asciidoctorPdf(type: org.asciidoctor.gradle.jvm.AsciidoctorTask) {
	sources {
		include "index.adoc"
	}
}

syncDocumentationSourceForAsciidoctorPdf {
	from(documentPluginGoals) {
		into "asciidoc/goals"
	}
}

javadoc {
	options {
		author = true
		docTitle = "Spring Boot Maven Plugin ${project.version} API"
		encoding = "UTF-8"
		memberLevel = "protected"
		outputLevel = "quiet"
		splitIndex = true
		use = true
		windowTitle = "Spring Boot Maven Plugin ${project.version} API"
	}
}

task zip(type: Zip) {
	dependsOn asciidoctor, asciidoctorPdf
	duplicatesStrategy "fail"
	from(asciidoctorPdf.outputDir) {
		into "reference/pdf"
		rename "index.pdf", "${project.name}-reference.pdf"
	}
	from(asciidoctor.outputDir) {
		into "reference/htmlsingle"
	}
	from(javadoc) {
		into "api"
	}
}

task xsdResources(type: Sync) {
	from "src/main/xsd/layers-${project.ext.xsdVersion}.xsd"
	into "${buildDir}/generated/resources/xsd/org/springframework/boot/maven"
	rename { fileName -> "layers.xsd" }
}

prepareMavenBinaries {
	versions "3.9.0", "3.8.5", "3.6.3", "3.5.4"
}

artifacts {
	"documentation" zip
}

tasks.named("documentPluginGoals") {
	goalSections = [
		"build-image": "build-image",
		"build-info": "build-info",
		"help": "help",
		"repackage": "packaging",
		"run": "run",
		"start": "integration-tests",
		"stop": "integration-tests"
	]
}

// 自动化同步插件模板 POM 坐标逻辑
// 由于 buildSrc 格式校验极其严苛，我们不在 Java 代码里做动态替换，
// 而是直接在 Gradle 钩子里确保模板文件始终与项目坐标保持一致。
// ── 扩展说明（artifactId 同步）──────────────────────────────
// (1) 为什么：原任务 syncPluginPomGroupId 仅同步 groupId，但 Maven Plugin
//     Tools 根据 src/maven/resources/pom.xml 中的完整坐标生成 plugin.xml
//     描述符，若 artifactId 仍为 "spring-boot-maven-plugin" 而发布名为
//     "bjca-footstone-bpring-boot-maven-plugin"，Maven 会报描述符不匹配错误：
//     "Invalid plugin descriptor ... Plugin's descriptor contains the wrong
//     artifact ID: spring-boot-maven-plugin"
// (2) 替换逻辑与 DeployedPlugin.java / BomPlugin.java 一致：
//     将 project.name 中的 "spring-boot" 替换为 forkArtifactPrefix + "-boot"。
// (3) 当 forkArtifactPrefix 未配置时仅同步 groupId，跳过 artifactId 替换
//     （向后兼容）。
def syncPluginPomCoordinates = tasks.register("syncPluginPomCoordinates") {
	doLast {
		def pomFile = file("src/maven/resources/pom.xml")
		if (pomFile.exists()) {
			def content = pomFile.text
			// 同步 groupId
			def updatedContent = content.replaceAll(
				'<groupId>.*</groupId>',
				"<groupId>${project.group}</groupId>"
			)
			// 同步 artifactId（仅当 forkArtifactPrefix 已配置时）
			def forkPrefix = project.findProperty("forkArtifactPrefix")
			if (forkPrefix) {
				def forkArtifactId = project.getName().replace("spring-boot", "${forkPrefix}-boot")
				updatedContent = updatedContent.replaceFirst(
					'<artifactId>[^<]+</artifactId>',
					"<artifactId>${forkArtifactId}</artifactId>"
				)
			}
			if (content != updatedContent) {
				pomFile.text = updatedContent
				println "成功同步插件模板坐标 — groupId: ${project.group}" + (forkPrefix ? ", artifactId: ${project.getName().replace('spring-boot', forkPrefix + '-boot')}" : "")
			}
		}
	}
}

// 确保在生成描述符的任务运行前先执行同步
tasks.matching { it.name.startsWith("sync") && it.name.contains("Inputs") }.all {
	it.dependsOn syncPluginPomCoordinates
}
