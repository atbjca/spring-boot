# ============================================================================
# Fork GAV 核心配置
# ============================================================================
# 以下两个参数是 fork 制品坐标转换的核心，所有模块的 groupId 和 artifactId
# 均由此派生，修改时需同步更新私有仓库和下游项目的依赖声明。
#
# forkArtifactPrefix —— 制品名前缀
#   用途：替换原始 Spring 制品中的 "spring" 前缀
#   影响范围：所有模块的 artifactId（如 spring-boot → bjca-footstone-bpring-boot）
#   配置变更示例：若需改为 "mycompany-spring"，修改此值即可全局生效
forkArtifactPrefix=bjca-footstone-bpring

# forkGroupIdBase —— 基础 GroupId
#   用途：所有模块 groupId 的根路径，自动派生子包
#   影响范围：
#     - boot 模块: cn.bjca.footstone.bpring.boot
#     - security 模块: cn.bjca.footstone.bpring.security
#     - framework 模块: cn.bjca.footstone.bpring.framework
#   配置变更示例：若组织域名变更，修改此值即可全局生效
forkGroupIdBase=cn.bjca.footstone.bpring

# ============================================================================
# 版本配置
# ============================================================================
# version —— 当前 fork 项目版本号（用于所有模块的发布版本）
version=2.7.18-nes.patch.1-SNAPSHOT

# springBootVersion —— Spring Boot 原始基线版本号
#   用途：供 SpringBootVersion.getVersion() 运行时返回，标识所基于的上游版本
springBootVersion=2.7.18

# springFrameworkVersion —— fork 后的 Spring Framework 版本
#   用途：构建时解析 Spring Framework 依赖的版本号
springFrameworkVersion=5.3.39-nes.patch.1-SNAPSHOT

# springSecurityVersion —— fork 后的 Spring Security 版本
#   用途：构建时解析 Spring Security 依赖的版本号
springSecurityVersion=5.8.16-nes.patch.1-SNAPSHOT

# ============================================================================
# Gradle 构建参数
# ============================================================================
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx10g -Dfile.encoding=UTF-8

# ============================================================================
# 第三方依赖版本
# ============================================================================
assertjVersion=3.27.7
commonsCodecVersion=1.15
hamcrestVersion=2.2
jacksonVersion=2.21.4
junitJupiterVersion=5.8.2
kotlinVersion=1.9.22
mavenVersion=3.9.4
tomcatVersion=9.0.119

kotlin.stdlib.default.dependency=false
