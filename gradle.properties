# ============================================================================
# Fork GAV 核心配置
# ============================================================================
# 以下两个参数是 fork 制品坐标转换的核心，所有模块的 groupId 和 artifactId
# 均由此派生，修改时需同步更新私有仓库和下游项目的依赖声明。
#
# forkArtifactPrefix —— 制品名前缀
#   用途：替换原始 Spring 制品中的 "spring" 前缀
#   影响范围：所有模块的 artifactId（如 spring-boot → bjca-footstone-bpring-boot）
#   配置变更示例：若需改为 "mycompany-spring"，修改此值即可全局生效
forkArtifactPrefix=bjca-footstone-bpring

# forkGroupIdBase —— 基础 GroupId
#   用途：所有模块 groupId 的根路径，自动派生子包
#   影响范围：
#     - boot 模块: cn.bjca.footstone.bpring.boot
#     - security 模块: cn.bjca.footstone.bpring.security
#     - framework 模块: cn.bjca.footstone.bpring.framework
#   配置变更示例：若组织域名变更，修改此值即可全局生效
forkGroupIdBase=cn.bjca.footstone.bpring

# ============================================================================
# 版本配置
# ============================================================================
# version —— 当前 fork 项目版本号（用于所有模块的发布版本）
version=2.7.18-nes.patch.2-SNAPSHOT

# springBootVersion —— Spring Boot 原始基线版本号
#   用途：供 SpringBootVersion.getVersion() 运行时返回，标识所基于的上游版本
springBootVersion=2.7.18

# springFrameworkVersion —— fork 后的 Spring Framework 版本
#   用途：构建时解析 Spring Framework 依赖的版本号
springFrameworkVersion=5.3.39-nes.patch.1

# springSecurityVersion —— fork 后的 Spring Security 版本
#   用途：构建时解析 Spring Security 依赖的版本号
springSecurityVersion=5.8.16-nes.patch.2-SNAPSHOT

# springRetryNesVersion —— NES Spring Retry 统一版本
#   用途：驱动官方 Retry 精确映射、Boot BOM 管理和 Starter 发布依赖
#   注意：当前为含 CVE-2026-41710 缓解的 SNAPSHOT，不能用于 Boot RELEASE
springRetryNesVersion=1.3.4-nes.patch.1-SNAPSHOT

# springKafkaNesVersion —— NES Spring Kafka 主模块和测试模块统一版本
#   用途：驱动官方 Kafka 坐标映射、Boot BOM 管理和安全验证
#   注意：patch.2 直接采用 NES Retry，当前仍为 SNAPSHOT
springKafkaNesVersion=2.9.13-nes.patch.2-SNAPSHOT

# reactorNettyNesVersion —— Reactor Netty NES fork 统一版本
#   用途：驱动官方 Reactor Netty 坐标映射、BOM 管理和 starter 发布依赖
#   注意：incubator QUIC 使用独立 group 和版本线，不由该属性管理
reactorNettyNesVersion=1.0.48-nes.patch.1

# elasticsearchNesVersion —— NES Elasticsearch 7.17 客户端闭包统一版本
#   用途：驱动 16 个生产模块、Java API Client 的 BOM 管理与 allowlist 映射
#   禁止把 Transport Client / integ-test / 官方 elasticsearch-java 纳入该闭包
elasticsearchNesVersion=7.17.29-nes.patch.1-SNAPSHOT

# barssonNesVersion —— NES Barsson（Jakarta JSON-P 2.0 provider）版本
barssonNesVersion=1.0.5-nes.patch.1-SNAPSHOT

# springDataBomNesVersion —— NES Spring Data 发行列车 BOM（patch.2）
springDataBomNesVersion=2021.2.18-nes.patch.2-SNAPSHOT

# springDataElasticsearchNesVersion —— Spring Data Elasticsearch NES 独立版本线
springDataElasticsearchNesVersion=4.4.18-nes.patch.2-SNAPSHOT

# ============================================================================
# Gradle 构建参数
# ============================================================================
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx10g -Dfile.encoding=UTF-8

# ============================================================================
# 第三方依赖版本
# ============================================================================
assertjVersion=3.27.7
commonsCodecVersion=1.15
hamcrestVersion=2.2
jacksonVersion=2.21.5
junitJupiterVersion=5.8.2
kotlinVersion=1.9.22
mavenVersion=3.9.4
tomcatVersion=9.0.120

kotlin.stdlib.default.dependency=false
