plugins {
	id "base"
	id "org.jetbrains.kotlin.jvm" apply false // https://youtrack.jetbrains.com/issue/KT-30276
	id "io.spring.nohttp" version "0.0.11"
	id 'maven-publish' // 2026-02-25 因为 publishing 而添加的插件
}

description = "Spring Boot Build"

defaultTasks 'build'

nohttp {
	allowlistFile = project.file("src/nohttp/allowlist.lines")
	source.exclude "**/bin/**"
	source.exclude "**/build/**"
	source.exclude "**/out/**"
	source.exclude "**/target/**"
	source.exclude "**/.settings/**"
	source.exclude "**/.classpath"
	source.exclude "**/.project"
	source.exclude "openspec/**"
	source.exclude "spring-boot-project/spring-boot-tools/spring-boot-buildpack-platform/src/test/resources/org/springframework/boot/buildpack/platform/docker/export.tar"
}

check {
	dependsOn checkstyleNohttp
}

allprojects {
	// 动态引用 gradle.properties 中的 forkGroupIdBase，实现 groupId 单点管理
	group "${forkGroupIdBase}.boot"

	repositories {
		maven {
			name = 'nexus'
			url = nexusPublicUrl
			allowInsecureProtocol = true
			credentials {
				username = nexusUsername
				password = nexusPassword
			}
		}
		mavenLocal()
		mavenCentral()
		if (version.endsWith('-SNAPSHOT')) {
			maven {
				name = 'nexus'
				url = nexusSnapshotUrl
				allowInsecureProtocol = true
				credentials {
					username = nexusUsername
					password = nexusPassword
				}
			}
		}
//		if (version.contains('-')) {
//			maven { url "https://repo.spring.io/milestone" }
//		}
//		if (version.endsWith('-SNAPSHOT')) {
//			maven { url "https://repo.spring.io/snapshot" }
//		}
	}

	configurations.all {
		resolutionStrategy.cacheChangingModulesFor 0, "minutes"

		// ====================================================================
		// 全局排除 commons-logging
		// ====================================================================
		// Spring Boot 使用 spring-jcl 替代 commons-logging。kafka_2.13:3.9.2
		// 通过 commons-validator → commons-beanutils 传递引入了 commons-logging，
		// BOM 级别的 exclude 无法完全阻断深层传递依赖，因此在此全局排除。
		// ====================================================================
		exclude group: 'commons-logging', module: 'commons-logging'

		// ====================================================================
		// lz4-java 依赖替换
		// ====================================================================
		// kafka-clients 3.9.2 迁移到 at.yawk.lz4:lz4-java（原 org.lz4:lz4-java 的
		// 活跃 fork），而 elasticsearch 7.17.x 仍依赖旧 org.lz4:lz4-java。
		// 两者声明了相同的 Gradle capability，产生冲突。
		// 统一替换为新版 fork，同时修复 CVE-2025-12183 和 CVE-2025-66566。
		// ====================================================================
		resolutionStrategy.dependencySubstitution {
			substitute module('org.lz4:lz4-java') using module('at.yawk.lz4:lz4-java:1.10.1')
		}

		// ====================================================================
		// Fork GAV 自动映射规则
		// ====================================================================
		// 设计目的：透明地将上游 org.springframework / org.springframework.security
		// 组的依赖坐标自动替换为 fork 后的 GAV，使所有子模块 build.gradle 无需
		// 任何修改即可解析 fork 依赖。
		//
		// 映射参数来源：gradle.properties
		//   - forkArtifactPrefix  : 制品名前缀（替换原始 "spring"）
		//   - forkGroupIdBase     : 基础 GroupId
		//   - springFrameworkVersion : fork Spring Framework 版本
		//   - springSecurityVersion  : fork Spring Security 版本
		//
		// 如需增加新的映射组（如 spring-data），可在下方仿照现有规则添加
		// 新的 else if 分支，并在 gradle.properties 中定义对应版本参数。
		// ====================================================================
		resolutionStrategy.eachDependency { details ->
			def requested = details.requested

			// 规则一：org.springframework 组映射
			// 将 org.springframework:spring-xxx 替换为
			//   ${forkGroupIdBase}:${forkArtifactPrefix}-xxx:${springFrameworkVersion}
			if (requested.group == 'org.springframework' && requested.name.startsWith('spring-')) {
				def newArtifactId = requested.name.replaceFirst(/^spring-/, "${forkArtifactPrefix}-")
				details.useTarget("${forkGroupIdBase}:${newArtifactId}:${springFrameworkVersion}")
			}

			// 规则二：org.springframework.security 组映射
			// 将 org.springframework.security:spring-security-xxx 替换为
			//   ${forkGroupIdBase}.security:${forkArtifactPrefix}-security-xxx:${springSecurityVersion}
			else if (requested.group == 'org.springframework.security' && requested.name.startsWith('spring-security-')) {
				def newArtifactId = requested.name.replaceFirst(/^spring-security-/, "${forkArtifactPrefix}-security-")
				details.useTarget("${forkGroupIdBase}.security:${newArtifactId}:${springSecurityVersion}")
			}

			// 规则三：org.springframework.kafka 组映射
			// 将 org.springframework.kafka:spring-kafka{,-test} 替换为
			//   cn.bjca.footstone.bpring.kafka:bjca-footstone-bpring-kafka{,-test}:2.9.13-nes.patch.1-SNAPSHOT
			// Spring Kafka NES 分支已完成 artifactId 去特征化并发布到私服：
			// spring-kafka → bjca-footstone-bpring-kafka、spring-kafka-test → bjca-footstone-bpring-kafka-test；
			// GroupId、Version 不变。artifactId 通过 spring- 前缀替换得到，与规则一/二同构。
			else if (requested.group == 'org.springframework.kafka' && requested.name.startsWith('spring-kafka')) {
				def newArtifactId = requested.name.replaceFirst(/^spring-/, "${forkArtifactPrefix}-")
				details.useTarget("cn.bjca.footstone.bpring.kafka:${newArtifactId}:2.9.13-nes.patch.1-SNAPSHOT")
			}

			// 规则四：ch.qos.logback 组映射
			// 将 ch.qos.logback:logback-{classic,core} 替换为
			//   cn.bjca.footstone.bogback:bjca-footstone-bogback-{classic,core}:1.2.13-nes.patch.1
			// Logback fork 仓库仅发布了 bjca-footstone-bogback-* 制品，
			// 原始 ch.qos.logback 坐标在私有仓库中不存在，必须通过此规则透明替换。
			else if (requested.group == 'ch.qos.logback') {
				if (requested.name == 'logback-classic' || requested.name == 'logback-core') {
					def artifactSuffix = requested.name.replace('logback-', '')
					details.useTarget("cn.bjca.footstone.bogback:bjca-footstone-bogback-${artifactSuffix}:1.2.13-nes.patch.1")
				}
			}

			// 规则五：org.springframework.data 组映射（commons / keyvalue / redis）
			// 将 org.springframework.data:spring-data-{commons,keyvalue,redis} 替换为
			//   cn.bjca.footstone.bpring.data:bjca-footstone-bpring-data-{commons,keyvalue,redis}:2.7.18-nes.patch.1-SNAPSHOT
			// 这三个模块在 NES 分支完成本体去特征化（commons/keyvalue 另含本体 CVE 修复：
			// commons CVE-2026-41711/41716/41721、keyvalue CVE-2026-41719）并发布到私服，同为
			// 2.7.18-nes.patch.1-SNAPSHOT 版本线，故合并处理。elasticsearch 版本线不同（4.4.x），
			// 见规则六。其余 spring-data-*（jpa / mongodb / rest / neo4j / r2dbc 等）保持官方坐标，
			// 由 mavenCentral / 私服代理解析。
			// 本规则有双重作用：① 让源码中对上述模块的官方坐标声明解析到 NES 制品；
			// ② 堵住 spring-data-jpa 等未 fork 模块通过传递依赖回拉官方 spring-data-commons 的链路
			// （fork BOM 用 NES 坐标做 key，管不到官方坐标，故必须在此全局重写）。
			// 版本号硬编码为 fork 制品版本，与规则三（Kafka）同构。
			else if (requested.group == 'org.springframework.data'
					&& (requested.name == 'spring-data-commons'
						|| requested.name == 'spring-data-keyvalue'
						|| requested.name == 'spring-data-redis')) {
				def newArtifactId = requested.name.replaceFirst(/^spring-/, "${forkArtifactPrefix}-")
				details.useTarget("cn.bjca.footstone.bpring.data:${newArtifactId}:2.7.18-nes.patch.1-SNAPSHOT")
			}

			// 规则六：org.springframework.data:spring-data-elasticsearch 映射
			// 将 org.springframework.data:spring-data-elasticsearch 替换为
			//   cn.bjca.footstone.bpring.data:bjca-footstone-bpring-data-elasticsearch:4.4.18-nes.patch.1-SNAPSHOT
			// elasticsearch NES fork 跟随 Spring Data Elasticsearch 4.4.x 版本线，其制品版本为
			// 【4.4.18-nes.patch.1-SNAPSHOT】——与规则五的 2.7.18 版本线不同，故独立成一条分支，
			// 不能并入规则五（否则会解析到不存在的 ...-elasticsearch:2.7.18-... 坐标而失败）。
			// artifactId 同样走 spring- 前缀替换。
			else if (requested.group == 'org.springframework.data'
					&& requested.name == 'spring-data-elasticsearch') {
				def newArtifactId = requested.name.replaceFirst(/^spring-/, "${forkArtifactPrefix}-")
				details.useTarget("cn.bjca.footstone.bpring.data:${newArtifactId}:4.4.18-nes.patch.1-SNAPSHOT")
			}
		}
	}
}

tasks.named("checkstyleNohttp").configure {
	maxHeapSize = "10240m"
	minHeapSize = "6144m"
}

// 2026-02-25 增加了 deploy 配置
subprojects {
	afterEvaluate { project ->
		publishing {
			repositories {
				maven {
					name = 'nexus'
					url = project.version.toString().endsWith('-SNAPSHOT') ? nexusSnapshotUrl : nexusReleaseUrl
					allowInsecureProtocol = true
					credentials {
						username = nexusUsername
						password = nexusPassword
					}
				}
			}
		}
	}
}
