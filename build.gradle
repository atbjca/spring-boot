plugins {
	id "base"
	id "maven-publish"
}

description = "Spring Boot Build"

defaultTasks 'build'

allprojects {
	group = "${forkGroupIdBase}.boot"

	repositories {
		maven {
			name = 'nexus'
			url = nexusPublicUrl
			allowInsecureProtocol = true
			credentials {
				username = nexusUsername
				password = nexusPassword
			}
			content {
				includeGroupByRegex('cn\\.bjca\\.footstone\\.bpring(\\..+)?')
			}
		}
		mavenLocal()
		mavenCentral()
		if (version.endsWith('-SNAPSHOT')) {
			maven {
				name = 'nexusSnapshot'
				url = nexusSnapshotUrl
				allowInsecureProtocol = true
				credentials {
					username = nexusUsername
					password = nexusPassword
				}
				content {
					includeGroupByRegex('cn\\.bjca\\.footstone\\.bpring(\\..+)?')
				}
			}
		}
	}

	configurations.all {
		resolutionStrategy.cacheChangingModulesFor 0, "minutes"

		resolutionStrategy.eachDependency { details ->
			def requested = details.requested
			if (requested.group == 'org.springframework' && requested.name.startsWith('spring-')) {
				def newArtifactId = requested.name.replaceFirst(/^spring-/, "${forkArtifactPrefix}-")
				details.useTarget("${forkGroupIdBase}:${newArtifactId}:${springFrameworkVersion}")
			}
			else if (requested.group == 'org.springframework.security'
					&& requested.name == 'spring-security-oauth2-authorization-server') {
				details.useTarget("${forkGroupIdBase}.security:${forkArtifactPrefix}-security-oauth2-authorization-server:${springAuthorizationServerVersion}")
			}
			else if (requested.group == 'org.springframework.security' && requested.name.startsWith('spring-security-')) {
				def newArtifactId = requested.name.replaceFirst(/^spring-security-/, "${forkArtifactPrefix}-security-")
				details.useTarget("${forkGroupIdBase}.security:${newArtifactId}:${springSecurityVersion}")
			}
			// Spring Kafka NES 分支已完成 GAV 去特征化并发布私服：
			// org.springframework.kafka:spring-kafka{,-test}
			//   → cn.bjca.footstone.bpring.kafka:bjca-footstone-bpring-kafka{,-test}:3.3.16-nes.patch.1。
			// artifactId 通过 spring- 前缀替换得到，与上面 framework / security 规则同构。
			else if (requested.group == 'org.springframework.kafka' && requested.name.startsWith('spring-kafka')) {
				def newArtifactId = requested.name.replaceFirst(/^spring-/, "${forkArtifactPrefix}-")
				details.useTarget("${forkGroupIdBase}.kafka:${newArtifactId}:3.3.16-nes.patch.1")
			}
			// Spring Data NES 分支仅将 commons / keyvalue / redis / elasticsearch 四模块去特征化并发布私服，
			// 其余 spring-data-*（jpa / mongodb / neo4j / cassandra / couchbase / r2dbc / relational / rest 等）
			// 保持官方坐标 + 官方版本，由私服 / mavenCentral 代理解析，故不在此重写。
			// commons / keyvalue / redis 走 data 主线 3.5.x；elasticsearch 走独立版本线 5.5.x。
			// 本规则双重作用：① 让源码中对四模块的官方坐标声明解析到 NES 制品；
			// ② 堵住未 fork 的 data 模块经传递依赖回拉官方 spring-data-commons 的链路
			//（fork BOM 用 NES 坐标做 key，管不到官方坐标，故须在此全局重写）。
			else if (requested.group == 'org.springframework.data'
					&& (requested.name == 'spring-data-commons'
						|| requested.name == 'spring-data-keyvalue'
						|| requested.name == 'spring-data-redis'
						|| requested.name == 'spring-data-elasticsearch')) {
				def newArtifactId = requested.name.replaceFirst(/^spring-/, "${forkArtifactPrefix}-")
				def dataVersion = (requested.name == 'spring-data-elasticsearch')
						? '5.5.13-nes.patch.1'
						: '3.5.13-nes.patch.1'
				details.useTarget("${forkGroupIdBase}.data:${newArtifactId}:${dataVersion}")
			}
		}
	}
}

subprojects {
	apply plugin: "org.springframework.boot.conventions"

	afterEvaluate { project ->
		publishing {
			repositories {
				maven {
					name = 'nexus'
					url = project.version.toString().endsWith('-SNAPSHOT') ? nexusSnapshotUrl : nexusReleaseUrl
					allowInsecureProtocol = true
					credentials {
						username = nexusUsername
						password = nexusPassword
					}
				}
			}
		}
	}
}
